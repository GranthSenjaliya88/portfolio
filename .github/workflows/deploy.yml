name: Validate portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "portfolio-validation"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build, prerender, and audit SEO
        run: npm run build

      # The repository publishes the gh-pages branch via npm run deploy.
      # Source pushes validate here; existing Pages protection stays intact.
      - name: Upload validated website
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-site
          path: dist/
          include-hidden-files: true
